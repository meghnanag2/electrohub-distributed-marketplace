events { worker_connections 1024; }

http {

    # Don't advertise the nginx version in responses / error pages.
    server_tokens off;

    # No file uploads in this app (images are external Unsplash URLs), so a
    # small body cap is free protection against oversized-payload abuse.
    client_max_body_size 2m;

    limit_req_zone $binary_remote_addr zone=api_general:10m  rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_login:10m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_browse:10m   rate=60r/m;
    # NOTE: these are the demo-tuned limits (see electrohub_demo_script.md
    # segment 9). For real traffic a single SPA page load fires several API
    # calls, so 30r/m will produce spurious 429s — raise api_general to
    # ~120r/m and api_browse to ~300r/m before opening this to real users.
    # Keep api_login low: it is the brute-force defence.

    resolver 127.0.0.11 valid=10s ipv6=off;

    # In production this nginx sits behind Caddy (TLS termination), so the
    # peer address is Caddy's, not the client's. Without this, every visitor
    # would share ONE rate-limit bucket and $remote_addr in the app logs
    # would always be the proxy. Only private ranges are trusted, so a
    # public client cannot spoof X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    upstream user_service           { server user-service:8001; }
    upstream listing_service        { server listing-service:8002; }
    upstream messaging_service      { server messaging-service:8003; }
    upstream activity_service       { server activity-service:8004; }
    upstream recommendation_service { server recommendation-service:8005; }

    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Host              $host;

    server {
        listen 80;
        server_name _;

        # ── Not for public consumption ────────────────────────────────── #
        # Every service is a FastAPI app, so /docs, /redoc and
        # /openapi.json are live and unauthenticated by default and would
        # otherwise be served by the catch-all location below. The monolith
        # in backend/ also exposes /debug/* routes. Prometheus scrapes the
        # services directly over the Docker network, so /metrics never needs
        # to be reachable through this gateway either.
        location ~* ^/(docs|redoc|openapi\.json)$ { return 404; }
        location /debug   { return 404; }
        location /metrics { return 404; }

        location /messages/ws/ {
            proxy_pass http://messaging_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /auth/ {
            limit_req zone=api_login burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://user_service;
        }

        location /users/ {
            limit_req zone=api_general burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://user_service;
        }

        location /marketplace/ {
            limit_req zone=api_browse burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://listing_service;
        }

        location /messages/ {
            limit_req zone=api_general burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://messaging_service;
        }

        location /recommendations/ {
            proxy_pass http://recommendation_service;
        }

        location /activity/ {
            limit_req zone=api_general burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://activity_service;
        }

        location /health {
            proxy_pass http://user_service;
        }

        location / {
            limit_req zone=api_general burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://user_service;
        }
    }
}
